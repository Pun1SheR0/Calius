<style>
:root{
  --paper:#DFE2DE; --card:#F5F6F3; --ink:#131C22; --muted:#5E6B70;
  --rule:#C3C8C3; --rule-soft:#D8DCD8;
  --win:#16624A; --loss:#A33528; --draw:#8A7A4E;
  --focus:#B8860B;
  --pad:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Inter",system-ui,sans-serif; font-size:15px; line-height:1.55;
  padding:24px 16px 64px;
}
.wrap{max-width:860px;margin:0 auto}

h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;margin:0;letter-spacing:-.02em}
h1{font-size:26px}
h2{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}

header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:26px;flex-wrap:wrap}
header .meta{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

section{margin-bottom:34px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sechead:after{content:"";flex:1;height:1px;background:var(--rule)}

/* ---- controles ---- */
label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
input,select,button,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
input,select{
  width:100%;padding:9px 11px;background:var(--card);
  border:1px solid var(--rule);border-radius:2px;
}
input:focus-visible,select:focus-visible,button:focus-visible{
  outline:2px solid var(--focus);outline-offset:1px}
.num{font-family:"DM Mono",monospace;text-align:center}

button{
  background:var(--ink);color:var(--card);border:0;border-radius:2px;
  padding:10px 18px;cursor:pointer;font-weight:500;letter-spacing:.02em}
button:hover{background:#2A3942}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule);padding:6px 12px;font-size:13px}
button.ghost:hover{background:var(--card);color:var(--ink)}

/* ---- scoreboard ---- */
.board{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:26px var(--pad)}
.board .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.board .name{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:600;line-height:1.2}
.board .name.r{text-align:right}
.board .score{font-family:"DM Mono",monospace;font-size:58px;font-weight:500;
  letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.board .score .sep{color:var(--rule);padding:0 6px}
.lead{color:var(--win)}
.behind{color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);margin-top:22px}
.stat{background:var(--card);padding:11px 13px}
.stat .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:"DM Mono",monospace;font-size:19px;margin-top:2px}

/* secuencia de resultados */
.seq{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.seq i{width:17px;height:17px;display:grid;place-items:center;border-radius:2px;
  font-style:normal;font-size:10px;font-weight:600;color:var(--card);font-family:"DM Mono",monospace}
.seq i.w{background:var(--win)} .seq i.l{background:var(--loss)}
.seqnote{font-size:11px;color:var(--muted);margin-top:6px}

/* ---- tablas ---- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:0 8px 7px;border-bottom:1px solid var(--rule)}
th.r,td.r{text-align:right}
td{padding:8px;border-bottom:1px solid var(--rule-soft)}
tr:hover td{background:var(--card)}
td.mono{font-variant-numeric:tabular-nums}

/* líneas de goles */
.lam{display:flex;gap:20px;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);
  border-top:3px solid var(--ink);padding:14px var(--pad);margin-bottom:2px}
.lam div{min-width:96px}
.lam .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lam .v{font-family:"DM Mono",monospace;font-size:19px}
table.lines{background:var(--card);border:1px solid var(--rule);border-top:0}
table.lines td,table.lines th{padding:7px 9px}
table.lines th.grp{border-bottom:0;padding-bottom:2px;color:var(--ink);font-weight:600}
table.lines input{width:66px;padding:4px 6px;text-align:center;
  font-family:"DM Mono",monospace;font-size:13px}
.fair{font-family:"DM Mono",monospace;font-weight:500}
.edge{font-family:"DM Mono",monospace;font-size:13px}
.edge.pos{color:var(--win);font-weight:500} .edge.neg{color:var(--muted)}
.split{border-left:1px solid var(--rule)}
textarea{width:100%;padding:11px;background:var(--card);border:1px solid var(--rule);
  border-radius:2px;font-family:"DM Mono",monospace;font-size:13px;line-height:1.7;resize:vertical}
textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.bad td{color:var(--loss)}
summary.advanced{cursor:pointer;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:6px 0;list-style:none}
summary.advanced::-webkit-details-marker{display:none}
summary.advanced:before{content:"+ ";font-family:"DM Mono",monospace}
details[open] summary.advanced:before{content:"– "}
summary.advanced:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Plegables de primer nivel: más visibles que el de carga masiva, porque
   ahora son la navegación principal, no una opción secundaria escondida. */
summary.toggle{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--rule);padding:13px var(--pad);
  border-radius:2px;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:15px}
summary.toggle::-webkit-details-marker{display:none}
summary.toggle:before{content:"+";font-family:"DM Mono",monospace;font-weight:400;
  color:var(--muted);font-size:17px;width:14px}
details[open]>summary.toggle:before{content:"–"}
summary.toggle:hover{background:#EAEBE6}
summary.toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
details[open]>summary.toggle{border-bottom:0;border-radius:2px 2px 0 0}
details[open]>summary.toggle+*{border:1px solid var(--rule);border-top:0;
  padding:16px var(--pad);background:var(--card)}
/* ficha de jugador */
.pcard{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);
  padding:20px var(--pad);margin-bottom:26px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.phead h3{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;
  letter-spacing:-.02em;margin:0}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));
  gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);margin-bottom:18px}
.pstat{background:var(--card);padding:11px 13px}
.pstat .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pstat .v{font-family:"DM Mono",monospace;font-size:19px;margin-top:2px}
.psub{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  margin:0 0 8px}
a.pname{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule);cursor:pointer}
a.pname:hover{border-bottom-color:var(--ink);background:var(--rule-soft)}
a.pname:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:1fr 62px 62px 1fr}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr auto}
@media(max-width:620px){.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}
  .board .score{font-size:42px}.board .name{font-size:17px}}

.empty{background:var(--card);border:1px dashed var(--rule);padding:26px var(--pad);color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;
  font-size:17px;font-weight:600;margin-bottom:4px}

.flag{background:#F7EFD9;border-left:3px solid var(--focus);padding:10px 13px;
  font-size:13px;margin-top:12px}
.flag b{font-weight:600}
.flag button{margin-left:8px}

.toast{position:relative;background:var(--ink);color:var(--card);padding:9px 13px;
  font-size:13px;margin-top:12px;border-radius:2px}
.hidden{display:none}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;
  border-top:1px solid var(--rule);padding-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
@media(prefers-reduced-motion:no-preference){
  .board,.toast{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(3px)}}
}

<div class="wrap">
<header>
  <h1>Marcador</h1>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span class="meta" id="counter">cargando…</span>
    <button id="update">Actualizar resultados</button>
  </div>
</header>
<p id="updateMsg" class="meta" style="margin:-16px 0 22px;min-height:16px"></p>
<div id="toast" class="toast hidden"></div>
<div id="perfil"></div>

<section>
  <div class="sechead"><h2>Enfrentamiento</h2></div>
  <div class="grid g3" style="margin-bottom:16px">
    <div><label for="selA">Jugador</label><select id="selA"></select></div>
    <div><label for="selB">Rival</label><select id="selB"></select></div>
    <div style="display:flex;align-items:flex-end"><button class="ghost" id="swap">Invertir</button></div>
  </div>
  <div id="board"></div>
</section>

<section>
  <details id="linesBox">
  <summary class="toggle">Líneas de goles y under/over</summary>
  <div id="lines"></div>
  </details>
</section>



<section>
  <details id="histBox">
  <summary class="toggle">Ver historial completo de partidos</summary>
  <div id="history"></div>
  </details>
</section>

<section>
  <details id="playersBox">
  <summary class="toggle">Ver todos los jugadores y su récord</summary>
  <div id="players"></div>
  </details>
</section>

<div class="foot">
  <span id="status">Datos actualizados automáticamente desde EGamersWorld.</span>
</div>

<script>
const KEY = 'marcador:v1';
let db = { players: [], matches: [] };
let mem = false;

/* ---------- persistencia ---------- */
/* Tres niveles: window.storage (dentro de Claude), localStorage (archivo
   abierto en tu navegador) y memoria (último recurso, avisa al usuario). */
let backend = 'none';

async function load(){
  try{
    if(window.storage){
      const r = await window.storage.get(KEY);
      backend = 'cloud';
      if(r && r.value) db = JSON.parse(r.value);
      return;
    }
  }catch(e){
    if(window.storage){ backend = 'cloud'; return; }   // clave aún no creada
  }
  try{
    const raw = localStorage.getItem(KEY);
    localStorage.setItem(KEY + ':probe', '1');
    localStorage.removeItem(KEY + ':probe');
    backend = 'local';
    if(raw) db = JSON.parse(raw);
  }catch(e){
    backend = 'memory';
  }
  showBackend();
}
/* Pide al navegador que no desaloje estos datos si va justo de espacio. */
async function requestPersist(){
  try{
    if(navigator.storage && navigator.storage.persist){
      if(!(await navigator.storage.persisted())) await navigator.storage.persist();
    }
  }catch(e){}
}

function showBackend(){
  const el = document.getElementById('status');
  if(backend === 'memory') el.textContent =
    'Sin almacenamiento en este navegador: los datos se pierden al cerrar.';
  // backend === 'local' deja el texto por defecto del pie de página tal cual.
}
async function save(){
  try{
    if(backend === 'cloud'){ await window.storage.set(KEY, JSON.stringify(db)); return; }
    if(backend === 'local'){ localStorage.setItem(KEY, JSON.stringify(db)); return; }
  }catch(e){ toast('No se pudo guardar en este navegador.'); }
}

/* ---------- actualización en vivo ---------- */
/* Una página web no puede leer otra web directamente: el navegador lo bloquea
   (CORS). Se pasa por un intermediario público. Se prueban varios por si uno
   está caído. Si todos fallan, la app sigue funcionando con lo que ya tiene. */
const ORIGEN = 'https://egamersworld.com/fifa/matches/history';
const PUENTES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://r.jina.ai/' + u,
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
];

const RE_LINK = /\/fifa\/match\/[A-Za-z0-9_-]+\/([a-z0-9][a-z0-9-]*?)-vs-([a-z0-9][a-z0-9-]*?)-([A-Za-z0-9_-]{7,})/g;
const RE_GOLES = /Bo\d\s*(?:<[^>]*>\s*)*(\d{1,2})\s*(?:<[^>]*>\s*)*:\s*(?:<[^>]*>\s*)*(\d{1,2})/g;
const RE_FECHA = /(\d{2})\.(\d{2})\.(\d{2})/g;

const bonito = slug => slug.split('-').filter(Boolean)
  .map(p => p[0].toUpperCase() + p.slice(1)).join(' ');

function extraer(texto){
  const filas = [];
  RE_LINK.lastIndex = 0;
  let m;
  while((m = RE_LINK.exec(texto)) !== null){
    const [, aSlug, bSlug, id] = m;
    const ventana = texto.slice(Math.max(0, m.index - 4000), m.index);

    const goles = [...ventana.matchAll(RE_GOLES)];
    if(!goles.length) continue;
    const g = goles[goles.length - 1];
    const ga = +g[1], gb = +g[2];
    if(ga === gb) continue;

    const fechas = [...ventana.matchAll(RE_FECHA)];
    let date = '';
    if(fechas.length){ const f = fechas[fechas.length - 1]; date = `20${f[3]}-${f[2]}-${f[1]}`; }

    filas.push({ id, a: bonito(aSlug), b: bonito(bSlug), ga, gb, date });
  }
  return filas;
}

async function actualizar(){
  const btn = document.getElementById('update');
  const est = document.getElementById('updateMsg');
  btn.disabled = true;
  est.textContent = 'Buscando resultados nuevos…';

  let texto = null;
  for(const puente of PUENTES){
    try{
      const r = await fetch(puente(ORIGEN), {cache:'no-store'});
      if(!r.ok) continue;
      const t = await r.text();
      if(t && t.length > 2000){ texto = t; break; }
    }catch(e){ /* siguiente puente */ }
  }

  btn.disabled = false;
  if(!texto){
    est.textContent = 'No se ha podido conectar. Prueba de nuevo más tarde.';
    return;
  }

  const filas = extraer(texto);
  if(!filas.length){
    est.textContent = 'Conectado, pero no se han reconocido resultados. '
      + 'La web de origen ha cambiado y hay que ajustar la app.';
    return;
  }

  db.feedIds = db.feedIds || [];
  const conocidos = new Set(db.feedIds);
  let nuevos = 0;
  for(const f of filas){
    if(conocidos.has(f.id)) continue;
    const a = ensurePlayer(f.a), b = ensurePlayer(f.b);
    db.matches.push({ id:'f'+f.id, a:a.id, b:b.id, ga:f.ga, gb:f.gb,
                      date:f.date, note:'EGW' });
    db.feedIds.push(f.id); conocidos.add(f.id);
    nuevos++;
  }
  db.lastUpdate = new Date().toISOString();
  await save();
  renderAll();
  est.textContent = nuevos
    ? `${nuevos} partidos nuevos añadidos.`
    : `Ya estaba todo al día (${filas.length} partidos revisados).`;
}

/* ---------- sincronización automática ---------- */
/* La app busca un data.json junto a ella al arrancar y añade lo que no tenga.
   Así el usuario final no importa nada: abre y los partidos ya están.
   Si el archivo no existe (o se abre en local), no pasa nada. */
const FEED = 'data.json';

/* El servidor es la unica fuente de verdad: la app se queda exactamente con
   lo que hay en data.json, ni mas ni menos. Antes solo anadia y nunca
   borraba, asi que cuando se limpiaba el feed los partidos viejos se
   quedaban atrapados en cada navegador para siempre. Como ya no hay entrada
   manual, no hay nada del usuario que se pueda perder al reemplazar. */
async function syncFeed(){
  let feed;
  try{
    const r = await fetch(FEED + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return null;
    feed = await r.json();
  }catch(e){ return null; }
  if(!feed || !Array.isArray(feed.matches)) return null;

  const antes = db.matches.length;

  // Se reconstruye todo desde cero para que los jugadores que ya no
  // aparecen en ningun partido dejen de existir tambien.
  db.players = [];
  db.matches = [];
  delete db.feedIds;

  for(const m of feed.matches){
    if(!m.id || !m.a || !m.b || m.ga === m.gb) continue;
    const a = ensurePlayer(String(m.a)), b = ensurePlayer(String(m.b));
    db.matches.push({ id:'f'+m.id, a:a.id, b:b.id,
      ga:+m.ga, gb:+m.gb, date:m.date||'', note:m.note||'' });
  }

  await save();
  return { total: db.matches.length, cambio: db.matches.length - antes };
}

/* ---------- nombres ---------- */
const norm = s => s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9]/g,'');

function findPlayer(name){
  const n = norm(name);
  return db.players.find(p => norm(p.name) === n) || null;
}
function ensurePlayer(name){
  const found = findPlayer(name);
  if(found) return found;
  const p = { id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
              name:name.trim() };
  db.players.push(p);
  return p;
}

/* ---------- consultas ---------- */
const pName = id => (db.players.find(p=>p.id===id)||{name:'—'}).name;

function between(aId,bId){
  return db.matches
    .filter(m => (m.a===aId&&m.b===bId)||(m.a===bId&&m.b===aId))
    .sort((x,y)=> (x.date||'').localeCompare(y.date||''));
}
function overall(id){
  let w=0,l=0,gf=0,ga=0;
  for(const m of db.matches){
    if(m.a!==id && m.b!==id) continue;
    const mine = m.a===id ? m.ga : m.gb, his = m.a===id ? m.gb : m.ga;
    gf+=mine; ga+=his; mine>his ? w++ : l++;
  }
  return {w,l,gf,ga,n:w+l};
}

/* Metricas completas de un jugador para su ficha. Todo se calcula desde
   el punto de vista del jugador, no del que aparezca primero en el partido. */
function perfil(id){
  const suyos = db.matches
    .filter(m => m.a===id || m.b===id)
    .sort((x,y)=> (y.date||'').localeCompare(x.date||''));

  const rivales = new Map();
  const totales = [];
  let racha = 0, rachaTipo = null;

  for(const m of suyos){
    const esA = m.a===id;
    const mios = esA ? m.ga : m.gb, suyos_ = esA ? m.gb : m.ga;
    const gane = mios > suyos_;
    const rivalId = esA ? m.b : m.a;

    totales.push(mios + suyos_);

    if(!rivales.has(rivalId)) rivales.set(rivalId, {v:0, d:0, gf:0, gc:0});
    const r = rivales.get(rivalId);
    gane ? r.v++ : r.d++;
    r.gf += mios; r.gc += suyos_;
  }

  // Racha actual: se cuenta desde el partido mas reciente hacia atras
  for(const m of suyos){
    const esA = m.a===id;
    const gane = (esA ? m.ga : m.gb) > (esA ? m.gb : m.ga);
    if(rachaTipo === null){ rachaTipo = gane; racha = 1; }
    else if(gane === rachaTipo) racha++;
    else break;
  }

  const s = overall(id);
  const mediaTotal = totales.length ? totales.reduce((a,b)=>a+b,0)/totales.length : 0;

  // Ultimos 5, del mas reciente al mas antiguo
  const forma = suyos.slice(0,5).map(m=>{
    const esA = m.a===id;
    return (esA ? m.ga : m.gb) > (esA ? m.gb : m.ga);
  });

  const listaRivales = [...rivales.entries()]
    .map(([rid,r]) => ({rid, ...r, n:r.v+r.d}))
    .sort((x,y)=> y.n-x.n || y.v-x.v);

  return {...s, partidos:suyos, mediaTotal, racha, rachaTipo, forma, rivales:listaRivales};
}

/* ---------- render ---------- */
function esc(s){ return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function renderBoard(){
  const el = document.getElementById('board');
  const a = document.getElementById('selA').value, b = document.getElementById('selB').value;
  if(!a || !b || a===b){
    el.innerHTML = `<div class="empty"><strong>Elige dos jugadores</strong>
      Aquí verás el marcador entre ellos y todos sus partidos.</div>`;
    return;
  }
  const ms = between(a,b);
  if(!ms.length){
    el.innerHTML = `<div class="empty"><strong>Nunca se han enfrentado</strong>
      No hay ningún partido registrado entre ${esc(pName(a))} y ${esc(pName(b))}.</div>`;
    return;
  }
  let wa=0,wb=0,gfa=0,gfb=0; const seq=[];
  for(const m of ms){
    const ga = m.a===a ? m.ga : m.gb, gb = m.a===a ? m.gb : m.ga;
    gfa+=ga; gfb+=gb;
    if(ga>gb){ wa++; seq.push('w'); } else { wb++; seq.push('l'); }
  }
  const pct = wa/ms.length;
  const last5 = seq.slice(-5);
  let run=0; const lastRes = seq[seq.length-1];
  for(let i=seq.length-1;i>=0 && seq[i]===lastRes;i--) run++;

  el.innerHTML = `
  <div class="board">
    <div class="row">
      <div class="name ${wa>wb?'lead':'behind'}"><a class="pname" data-jugador="${a}">${esc(pName(a))}</a></div>
      <div class="score"><span class="${wa>wb?'lead':''}">${wa}</span><span class="sep">–</span><span class="${wb>wa?'lead':''}">${wb}</span></div>
      <div class="name r ${wb>wa?'lead':'behind'}"><a class="pname" data-jugador="${b}">${esc(pName(b))}</a></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Partidos</div><div class="v">${ms.length}</div></div>
      <div class="stat"><div class="k">Victorias ${esc(pName(a))}</div><div class="v">${(pct*100).toFixed(0)}%</div></div>
      <div class="stat"><div class="k">Goles</div><div class="v">${gfa}–${gfb}</div></div>
      <div class="stat"><div class="k">Media total</div><div class="v">${((gfa+gfb)/ms.length).toFixed(2)}</div></div>
      <div class="stat"><div class="k">Racha actual</div><div class="v">${lastRes==='w'?pName(a):pName(b)} ×${run}</div></div>
      <div class="stat"><div class="k">Últimos 5</div>
        <div class="seq">${last5.map(s=>`<i class="${s}">${s==='w'?'V':'D'}</i>`).join('')}</div>
        <div class="seqnote">desde ${esc(pName(a))}</div></div>
    </div>
    ${ms.length<5 ? `<div class="flag">Solo ${ms.length} ${ms.length===1?'partido':'partidos'} entre ellos.
      Ese ${(pct*100).toFixed(0)}% no distingue a un jugador mejor de una racha de suerte.</div>` : ''}
  </div>`;
}

/* ---------- distribución de goles ---------- */
const LG_C=[0.99999999999980993,676.5203681218851,-1259.1392167224028,
  771.32342877765313,-176.61502916214059,12.507343278686905,
  -0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function lgamma(z){
  if(z<0.5) return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z);
  z-=1; let x=LG_C[0];
  for(let i=1;i<9;i++) x+=LG_C[i]/(z+i);
  const t=z+7.5;
  return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);
}
const poisPmf=(k,l)=> l<=0 ? (k===0?1:0) : Math.exp(-l+k*Math.log(l)-lgamma(k+1));
function nbPmf(k,mu,varr){
  const r=mu*mu/(varr-mu), p=r/(r+mu);
  return Math.exp(lgamma(k+r)-lgamma(r)-lgamma(k+1)+r*Math.log(p)+k*Math.log(1-p));
}

/** Ritmo goleador de un jugador sobre TODOS sus partidos. */
function rates(id){
  let gf=0,ga=0,n=0;
  for(const m of db.matches){
    if(m.a===id){ gf+=m.ga; ga+=m.gb; n++; }
    else if(m.b===id){ gf+=m.gb; ga+=m.ga; n++; }
  }
  return {n, gf: n?gf/n:null, ga: n?ga/n:null};
}
function globalAvg(){
  if(!db.matches.length) return 2.0;
  const total=db.matches.reduce((s,m)=>s+m.ga+m.gb,0);
  return total/(2*db.matches.length);   // goles por equipo y partido
}

/**
 * Total esperado del enfrentamiento.
 *  - modelo: ataque de uno × defensa del otro, escalado a la media global
 *  - directo: media de los cara a cara
 *  - mezcla: peso n/(n+K) al directo. Con K=5, hacen falta 5 precedentes
 *    para que el historial directo pese tanto como el modelo.
 */
const SHRINK_K = 5;
function goalModel(aId,bId){
  const avg=globalAvg(), ra=rates(aId), rb=rates(bId);
  const atkA = ra.gf!=null && avg ? ra.gf/avg : 1, defA = ra.ga!=null && avg ? ra.ga/avg : 1;
  const atkB = rb.gf!=null && avg ? rb.gf/avg : 1, defB = rb.ga!=null && avg ? rb.ga/avg : 1;
  const lamModel = atkA*defB*avg + atkB*defA*avg;

  const ms=between(aId,bId);
  const totals=ms.map(m=>m.ga+m.gb);
  const n=totals.length;
  const lamH2H = n ? totals.reduce((s,t)=>s+t,0)/n : null;
  const w = n/(n+SHRINK_K);
  const mu = n ? w*lamH2H + (1-w)*lamModel : lamModel;

  // Dispersión medida sobre todos los partidos de la base
  const allTot=db.matches.map(m=>m.ga+m.gb);
  let varr=mu, over=false;
  if(allTot.length>4){
    const m0=allTot.reduce((s,t)=>s+t,0)/allTot.length;
    const v0=allTot.reduce((s,t)=>s+(t-m0)**2,0)/(allTot.length-1);
    if(v0>m0*1.05){ varr = mu*(v0/m0); over=true; }
  }
  const pmf = k => over ? nbPmf(k,mu,varr) : poisPmf(k,mu);
  return {mu, lamModel, lamH2H, n, w, over, pmf,
          h2hMin: n?Math.min(...totals):null, h2hMax: n?Math.max(...totals):null};
}

const houseOdds = {};   // se conserva entre repintados

function renderLines(){
  const el=document.getElementById('lines');
  const a=document.getElementById('selA').value, b=document.getElementById('selB').value;
  if(!a||!b||a===b){
    el.innerHTML=`<div class="empty"><strong>Elige dos jugadores</strong>
      Aquí verás el total de goles esperado y la cuota justa de cada línea.</div>`;
    return;
  }
  if(db.matches.length<6){
    el.innerHTML=`<div class="empty"><strong>Faltan datos</strong>
      Con ${db.matches.length} partidos en total no hay base para estimar goles.
      Anota unos cuantos más.</div>`;
    return;
  }
  const g=goalModel(a,b);

  // Acumulada hasta 25 goles, suficiente para agotar la masa
  const P=[]; for(let k=0;k<=25;k++) P.push(g.pmf(k));
  const sum=P.reduce((s,p)=>s+p,0);
  const cum=[]; let c=0;
  for(const p of P){ c+=p/sum; cum.push(c); }

  const centre=Math.round(g.mu);
  const linesArr=[];
  for(let i=-2;i<=2;i++){ const L=centre+i-0.5; if(L>0.9) linesArr.push(L); }

  const side=(label,p,key)=>{
    const h=houseOdds[key]||'', o=parseFloat(h);
    const e=(o&&o>1)?(p*o-1):null;
    const cell = e===null ? '<span class="edge neg">—</span>'
      : `<span class="edge ${e>=0.02?'pos':'neg'}">${e>=0?'+':''}${(e*100).toFixed(1)}%</span>`;
    return `<div class="side">
      <div class="k">${label}</div>
      <div class="pv">${(p*100).toFixed(1)}%<small>justa ${p>0.001?(1/p).toFixed(2):'—'}</small></div>
      <div class="cmp"><input data-k="${key}" value="${h}" placeholder="casa"
        inputmode="decimal" aria-label="Cuota de la casa para ${label}">${cell}</div>
    </div>`;
  };
  const rows=linesArr.map(L=>{
    const under=cum[Math.floor(L)], over=1-under, key=L.toFixed(1);
    return `<div class="lcard"><div class="ln">${key}</div>
      ${side('Menos de '+key, under, key+'U')}
      ${side('Más de '+key,  over,  key+'O')}</div>`;
  }).join('');

  el.innerHTML=`
  <div class="lam">
    <div><div class="k">Total esperado</div><div class="v">${g.mu.toFixed(2)}</div></div>
    <div><div class="k">Cara a cara (${g.n})</div><div class="v">${g.lamH2H!=null?g.lamH2H.toFixed(2):'—'}</div></div>
    <div><div class="k">Modelo</div><div class="v">${g.lamModel.toFixed(2)}</div></div>
    <div><div class="k">Peso del directo</div><div class="v">${(g.w*100).toFixed(0)}%</div></div>
    <div><div class="k">Rango visto</div><div class="v">${g.n?g.h2hMin+'–'+g.h2hMax:'—'}</div></div>
  </div>
  <div class="lhead"><div>Línea</div><div>Menos de</div><div>Más de</div></div>
  ${rows}
  <div class="flag">
    ${g.over?'Distribución binomial negativa, ajustada a la dispersión real de tus datos.'
            :'Distribución de Poisson: aún no hay dispersión suficiente para ajustarla.'}
    ${g.n<5?` El historial directo (${g.n}) pesa solo un ${(g.w*100).toFixed(0)}%: la estimación viene sobre todo del ritmo goleador de cada uno.`:''}
    La cuota justa no lleva margen — cualquier casa ofrecerá menos. Solo hay valor si te dan
    <b>más</b> que ese número.
  </div>`;

  el.querySelectorAll('input[data-k]').forEach(inp=>{
    inp.oninput=()=>{ houseOdds[inp.dataset.k]=inp.value; };
    inp.onchange=()=>{ houseOdds[inp.dataset.k]=inp.value; renderLines(); };
  });
}

const POR_PAGINA = 40;
let paginaHistorial = 1;

function renderHistory(){
  const el = document.getElementById('history');
  const a = document.getElementById('selA').value, b = document.getElementById('selB').value;
  const pair = a && b && a!==b;
  const ms = (pair ? between(a,b) : [...db.matches].sort((x,y)=>(y.date||'').localeCompare(x.date||''))).slice();
  if(pair) ms.reverse();
  if(!ms.length){ el.innerHTML = `<div class="empty"><strong>Sin partidos</strong>Anota el primero arriba.</div>`; return; }

  const totalPaginas = Math.max(1, Math.ceil(ms.length / POR_PAGINA));
  if(paginaHistorial > totalPaginas) paginaHistorial = totalPaginas;
  if(paginaHistorial < 1) paginaHistorial = 1;
  const inicio = (paginaHistorial - 1) * POR_PAGINA;
  const pagina = ms.slice(inicio, inicio + POR_PAGINA);

  el.innerHTML = `<table><thead><tr>
      <th>Fecha</th><th>Jugador</th><th class="r">Res.</th><th>Rival</th><th>Torneo</th><th></th>
    </tr></thead><tbody>${pagina.map(m=>`
      <tr><td class="mono" style="color:var(--muted)">${m.date||'—'}</td>
        <td><a class="pname" data-jugador="${m.a}">${esc(pName(m.a))}</a></td>
        <td class="r mono"><b>${m.ga}–${m.gb}</b></td>
        <td><a class="pname" data-jugador="${m.b}">${esc(pName(m.b))}</a></td>
        <td style="color:var(--muted)">${esc(m.note||'')}</td>
        <td class="r"><button class="ghost" data-del="${m.id}">Borrar</button></td></tr>`).join('')}
    </tbody></table>
    ${totalPaginas>1?`<div style="display:flex;align-items:center;gap:10px;margin-top:10px">
      <button class="ghost" id="histPrev" ${paginaHistorial<=1?'disabled':''}>Anterior</button>
      <span style="font-size:12px;color:var(--muted)">Página ${paginaHistorial} de ${totalPaginas} · ${ms.length} partidos</span>
      <button class="ghost" id="histNext" ${paginaHistorial>=totalPaginas?'disabled':''}>Siguiente</button>
    </div>`:`<p style="font-size:12px;color:var(--muted)">${ms.length} partidos.</p>`}`;

  el.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    db.matches = db.matches.filter(m=>m.id!==btn.dataset.del);
    await save(); renderAll();
  });
  const prev = document.getElementById('histPrev');
  const next = document.getElementById('histNext');
  if(prev) prev.onclick = () => { paginaHistorial--; renderHistory(); };
  if(next) next.onclick = () => { paginaHistorial++; renderHistory(); };
}

/* ---------- ficha de jugador ---------- */
let perfilAbierto = null;

function abrirPerfil(id){
  perfilAbierto = id;
  renderPerfil();
  document.getElementById('perfil').scrollIntoView({behavior:'smooth', block:'start'});
}
function cerrarPerfil(){ perfilAbierto = null; renderPerfil(); }

function renderPerfil(){
  const el = document.getElementById('perfil');
  if(!perfilAbierto){ el.innerHTML = ''; return; }

  const p = db.players.find(x=>x.id===perfilAbierto);
  if(!p){ el.innerHTML = ''; return; }
  const d = perfil(p.id);

  const pctV = d.n ? (100*d.w/d.n).toFixed(0)+'%' : '—';
  const dif = d.gf - d.ga;
  const rachaTxt = d.n ? `${d.rachaTipo?'V':'D'}${d.racha}` : '—';

  const topRivales = d.rivales.slice(0,6).map(r=>{
    const nombre = pName(r.rid);
    return `<tr>
      <td><a class="pname" data-jugador="${r.rid}">${esc(nombre)}</a></td>
      <td class="r mono">${r.n}</td>
      <td class="r mono">${r.v}-${r.d}</td>
      <td class="r mono" style="color:var(--muted)">${r.gf}–${r.gc}</td></tr>`;
  }).join('');

  const ultimos = d.partidos.slice(0,5).map(m=>{
    const esA = m.a===p.id;
    const mios = esA ? m.ga : m.gb, suyos = esA ? m.gb : m.ga;
    const rival = pName(esA ? m.b : m.a);
    const gane = mios > suyos;
    return `<tr>
      <td class="mono" style="color:var(--muted)">${m.date||'—'}</td>
      <td class="r mono"><b style="color:${gane?'var(--win)':'var(--loss)'}">${mios}–${suyos}</b></td>
      <td><a class="pname" data-jugador="${esA?m.b:m.a}">${esc(rival)}</a></td>
      <td style="color:var(--muted)">${esc(m.note||'')}</td></tr>`;
  }).join('');

  el.innerHTML = `<div class="pcard">
    <div class="phead">
      <h3>${esc(p.name)}</h3>
      <button class="ghost" id="cerrarPerfil">Cerrar</button>
    </div>
    <div class="pstats">
      <div class="pstat"><div class="k">Partidos</div><div class="v">${d.n}</div></div>
      <div class="pstat"><div class="k">Victorias</div><div class="v">${d.w}-${d.l}</div></div>
      <div class="pstat"><div class="k">% victorias</div><div class="v">${pctV}</div></div>
      <div class="pstat"><div class="k">Goles</div><div class="v">${d.gf}–${d.ga}</div></div>
      <div class="pstat"><div class="k">Diferencia</div><div class="v">${dif>=0?'+':''}${dif}</div></div>
      <div class="pstat"><div class="k">Media total</div><div class="v">${d.mediaTotal.toFixed(2)}</div></div>
      <div class="pstat"><div class="k">Racha</div><div class="v">${rachaTxt}</div></div>
      <div class="pstat"><div class="k">Últimos 5</div>
        <div class="seq">${d.forma.map(g=>`<i class="${g?'w':'l'}">${g?'V':'D'}</i>`).join('')}</div>
      </div>
    </div>
    ${d.n<5?`<div class="flag">Solo ${d.n} ${d.n===1?'partido':'partidos'} registrados.
      Con esta muestra, el porcentaje de victorias no distingue nivel real de suerte.</div>`:''}
    ${topRivales?`<p class="psub">Rivales más frecuentes</p>
    <table><thead><tr><th>Rival</th><th class="r">PJ</th><th class="r">V-D</th>
      <th class="r">Goles</th></tr></thead><tbody>${topRivales}</tbody></table>`:''}
    ${ultimos?`<p class="psub" style="margin-top:18px">Últimos partidos</p>
    <table><thead><tr><th>Fecha</th><th class="r">Res.</th><th>Rival</th>
      <th>Torneo</th></tr></thead><tbody>${ultimos}</tbody></table>`:''}
  </div>`;

  document.getElementById('cerrarPerfil').onclick = cerrarPerfil;
}

/* Un solo manejador para toda la pagina: cualquier nombre con data-jugador
   abre su ficha, sin tener que reenganchar eventos en cada repintado. */
document.addEventListener('click', e => {
  const a = e.target.closest('a.pname');
  if(!a) return;
  e.preventDefault();
  abrirPerfil(a.dataset.jugador);
});

function renderPlayers(){
  const el = document.getElementById('players');
  if(!db.players.length){ el.innerHTML = `<div class="empty"><strong>Aún no hay jugadores</strong>
    Se dan de alta solos al anotar el primer resultado.</div>`; return; }
  const rows = db.players.map(p=>({p,s:overall(p.id)}))
    .sort((x,y)=> (y.s.n?y.s.w/y.s.n:0)-(x.s.n?x.s.w/x.s.n:0) || y.s.n-x.s.n);
  el.innerHTML = `<table><thead><tr><th>Jugador</th><th class="r">PJ</th><th class="r">V</th>
    <th class="r">D</th><th class="r">%V</th><th class="r">Goles</th></tr></thead><tbody>
    ${rows.map(({p,s})=>`<tr><td><a class="pname" data-jugador="${p.id}">${esc(p.name)}</a></td><td class="r mono">${s.n}</td>
      <td class="r mono">${s.w}</td><td class="r mono">${s.l}</td>
      <td class="r mono">${s.n?(100*s.w/s.n).toFixed(0)+'%':'—'}</td>
      <td class="r mono" style="color:var(--muted)">${s.gf}–${s.ga}</td></tr>`).join('')}
    </tbody></table>`;
}

function renderSelectors(){
  const sorted = [...db.players].sort((a,b)=>a.name.localeCompare(b.name));
  for(const id of ['selA','selB']){
    const sel = document.getElementById(id), keep = sel.value;
    sel.innerHTML = `<option value="">—</option>` +
      sorted.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
    if(sorted.some(p=>p.id===keep)) sel.value = keep;
  }
  document.getElementById('counter').textContent =
    `${db.players.length} jugadores · ${db.matches.length} partidos`;
}

function renderAll(){ renderSelectors(); renderBoard(); renderLines();
  renderHistory(); renderPlayers(); }

/* ---------- acciones ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.add('hidden'), 3200);
}

document.getElementById('update').onclick = actualizar;

document.getElementById('swap').onclick = () => {
  const A = document.getElementById('selA'), B = document.getElementById('selB');
  [A.value, B.value] = [B.value, A.value];
  renderBoard(); renderLines(); renderHistory();
};
document.getElementById('selA').onchange = () => { paginaHistorial=1; renderBoard(); renderLines(); renderHistory(); };
document.getElementById('selB').onchange = () => { paginaHistorial=1; renderBoard(); renderLines(); renderHistory(); };

load().then(async () => {
  renderAll(); requestPersist();
  const r = await syncFeed();
  if(r){
    renderAll();
    if(r.cambio > 0) toast(`${r.cambio} partidos nuevos.`);
    else if(r.cambio < 0) toast(`Datos actualizados: ${r.total} partidos.`);
  }
});
