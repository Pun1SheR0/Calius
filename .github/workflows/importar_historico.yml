name: Importar historico Liquipedia

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Cuantos torneos probar (vacio o 0 = todos, ~1h)'
        required: false
        default: '15'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Importar de Liquipedia
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "${{ github.event.inputs.limite }}" ] || [ "${{ github.event.inputs.limite }}" = "0" ]; then
            python scripts/importar_liquipedia.py
          else
            python scripts/importar_liquipedia.py --limit ${{ github.event.inputs.limite }}
          fi

      - name: Guardar progreso y resultados
      if: always()
        run: |
          git config user.name  "importador"
          git config user.email "actions@github.com"
          git add data.json liq_progreso.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Importacion Liquipedia $(date -u +'%Y-%m-%d %H:%M')"
          git push
